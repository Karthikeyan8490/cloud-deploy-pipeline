name: 🚀 Build, Push & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ──────────────────────────────────────────────────────────────
# JOB 1 — Build & Push Docker image to GitHub Container Registry
# ──────────────────────────────────────────────────────────────
jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to AWS EC2 via SSH
  # ──────────────────────────────────────────────────────────────
  deploy:
    name: 🌐 Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE="ghcr.io/${{ github.repository }}:latest"

            echo "📦 Pulling latest image..."
            docker pull $IMAGE

            echo "🔄 Restarting container..."
            docker stop flask-app 2>/dev/null || true
            docker rm   flask-app 2>/dev/null || true

            docker run -d \
              --name flask-app \
              -p 5000:5000 \
              --restart unless-stopped \
              -e APP_VERSION="${{ github.sha }}" \
              $IMAGE

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment complete! Container status:"
            docker ps --filter name=flask-app

  # ──────────────────────────────────────────────────────────────
  # JOB 3 — Health check after deploy
  # ──────────────────────────────────────────────────────────────
  healthcheck:
    name: 🩺 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for app to start
        run: sleep 15

      - name: Check /health endpoint
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://${{ secrets.EC2_HOST }}/health)
          if [ "$STATUS" == "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
